name: Publish AI News Digest

on:
  push:
    paths:
      - "data/digest.json"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Restore cached Telegram destination
        uses: actions/cache/restore@v4
        with:
          path: .telegram_chat_id
          key: telegram-chat-id-v1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install publisher and free local audio dependencies
        run: pip install -r requirements.txt
      - name: Download free Russian Piper voice
        run: python -m piper.download_voices ru_RU-denis-medium --data-dir .piper-voices
      - name: Publish editor-prepared digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_VARIABLE: ${{ vars.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DIGEST_PATH: data/digest.json
          PIPER_VOICE: ru_RU-denis-medium
          PIPER_DATA_DIR: .piper-voices
          TELEGRAM_CHAT_ID_FILE: .telegram_chat_id
        run: python main.py
      - name: Save cached Telegram destination
        if: always() && hashFiles('.telegram_chat_id') != ''
        uses: actions/cache/save@v4
        with:
          path: .telegram_chat_id
          key: telegram-chat-id-v1
